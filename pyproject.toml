[project]
name = "datapilot-ai"
version = "0.1.0"
description = "Autonomous Data Research and Intelligence Platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
]

analytics = [
    "numpy>=2.1",
    "pandas>=2.2.3",
    "duckdb>=1.2",
    "scipy>=1.15",
    "statsmodels>=0.14",
    "scikit-learn>=1.6",
    "openpyxl>=3.1",
    "pyarrow>=19",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "engine"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
